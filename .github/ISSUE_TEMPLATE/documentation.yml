name: Documentation Issue
description: Report missing, incorrect, or unclear documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: URL or file path (e.g., README.md "Configuration" section)
      placeholder: "README.md / ..."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What's wrong?
      description: Describe the issue and suggest how to fix it.
      placeholder: |
        The docs say X, but it should say Y...
    validations:
      required: true
